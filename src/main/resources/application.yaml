spring:
  application:
    name: tms-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tms}
    username: ${DB_USERNAME:tms}
    password: ${DB_PASSWORD:tms}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST_FALLBACK:localhost}
    port: ${SMTP_PORT_FALLBACK:25}

server:
  port: ${SERVER_PORT:8080}

tms:
  jwt:
    # Must be at least 256 bits (32 bytes) for HS256 - generate a real
    # per-install secret in production, e.g.: openssl rand -base64 32
    secret: ${JWT_SECRET:CHANGE_ME_DEV_ONLY_dev-secret-key-not-for-production-use-32bytes}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
  mail-encryption:
    # AES key used to encrypt SMTP passwords at rest in mail_sender_settings
    # - must stay stable per-install (rotating it makes existing encrypted
    # passwords unreadable) and never leave the client's own server.
    secret: ${MAIL_ENCRYPTION_SECRET:CHANGE_ME_DEV_ONLY_mail-encryption-key-32bytes!!}
  admin-seed:
    username: ${ADMIN_SEED_USERNAME:admin}
    email: ${ADMIN_SEED_EMAIL:admin@example.com}
    password: ${ADMIN_SEED_PASSWORD:admin123}
  ingest:
    # Shared key the Modbus gateway service uses to push readings without a
    # user login - set the SAME value as TMS_INGEST_KEY on the gateway, and
    # generate a real one per install, e.g.: openssl rand -base64 32
    api-key: ${INGEST_API_KEY:CHANGE_ME_DEV_ONLY_ingest-key}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.tmsbackend: ${LOG_LEVEL:INFO}
